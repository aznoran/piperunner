<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "Noto Sans", system-ui, sans-serif; }
    a { color: #4ce0b3; } a:hover { color: #7febc9; }
  </style>
</helmet>
<div style="position: relative; width: 420px; height: 900px; overflow: hidden; background: linear-gradient(180deg, #111c2e 0%, #0b1220 55%, #070a12 100%); color: #ffffff;">

  <div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: 60px; padding: 4px; opacity: 0.6;">
    <sc-for list="{{cells}}" as="cell" hint-placeholder-count="105">
      <div style="margin: 5px; border: 1px solid rgba(255,255,255,0.04); border-radius: 5px;"></div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 74px; text-align: center;">
    <div style="font-size: 38px; font-weight: 600;">PIPE RUNNER</div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 152px; display: flex; flex-direction: column; gap: 14px;">

    <div style="position: relative; padding: 24px 22px; border-radius: 22px; background: linear-gradient(135deg, rgba(76,224,179,0.16), rgba(76,224,179,0.04)); border: 2px solid rgba(76,224,179,0.5); overflow: hidden;">
      <div style="font-size: 26px; font-weight: 700; color: #4ce0b3;">CLASSIC</div>
      <div style="margin-top: 5px; font-size: 15px; color: rgba(255,255,255,0.6);">Endless. One life. Go as far as you can.</div>
      <div style="margin-top: 16px; display: flex; align-items: baseline; gap: 8px;">
        <span style="font-size: 13px; letter-spacing: 0.14em; color: rgba(255,255,255,0.4);">FURTHEST</span>
        <span style="font-size: 24px; font-weight: 700;">47</span>
        <span style="font-size: 14px; color: rgba(255,255,255,0.45);">cells</span>
      </div>
      <div style="position: absolute; right: 20px; bottom: 20px; padding: 14px 26px; border-radius: 26px; background: #4ce0b3; color: #061f18; font-size: 18px; font-weight: 700;">PLAY</div>
    </div>

    <div style="padding: 22px; border-radius: 22px; background: rgba(21,32,58,0.7); border: 2px solid rgba(176,124,255,0.4);">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="font-size: 24px; font-weight: 700; color: #b07cff;">EXPEDITION</div>
        <div style="font-size: 15px; color: rgba(255,255,255,0.5);">12 / 40</div>
      </div>
      <div style="margin-top: 5px; font-size: 15px; color: rgba(255,255,255,0.6);">Hand-built runs with a goal each.</div>
      <div style="margin-top: 14px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.1); overflow: hidden;">
        <div style="width: 30%; height: 100%; background: #b07cff;"></div>
      </div>
      <div style="margin-top: 12px; font-size: 14px; color: rgba(255,255,255,0.45);">Next: <span style="color: rgba(255,255,255,0.75);">Reach row 30 without overwriting</span></div>
    </div>

    <div style="padding: 22px; border-radius: 22px; background: rgba(21,32,58,0.7); border: 2px solid rgba(255,210,63,0.4);">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="font-size: 24px; font-weight: 700; color: #ffd23f;">TODAY</div>
        <div style="font-size: 15px; color: rgba(255,255,255,0.5);">best 4</div>
      </div>
      <div style="margin-top: 5px; font-size: 15px; color: rgba(255,255,255,0.6);">One map. Same for everyone. Resets at midnight.</div>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 52px; display: flex; align-items: stretch; gap: 12px;">
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 20px 0; border-radius: 28px; border: 2px solid rgba(76,224,179,0.45); background: rgba(11,18,32,0.85);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#4ce0b3"><path d="M12 2l6 6-6 14-6-14z"></path></svg>
      <span style="font-size: 19px; font-weight: 600; color: #4ce0b3;">214</span>
      <span style="font-size: 19px; font-weight: 600; color: rgba(255,255,255,0.75);">· DEPOT</span>
    </div>
    <div style="width: 64px; display: flex; align-items: center; justify-content: center; border-radius: 28px; border: 2px solid rgba(255,255,255,0.16); background: rgba(11,18,32,0.85);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.6">
        <circle cx="12" cy="12" r="3.2"></circle>
        <path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2L5.6 5.6"></path>
      </svg>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const cells = [];
    for (let i = 0; i < 105; i += 1) cells.push({ i });
    return { cells };
  }
}
</script>
</body>
</html>
