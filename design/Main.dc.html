<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "Noto Sans", system-ui, sans-serif; }
    a { color: #4ce0b3; } a:hover { color: #7febc9; }
  </style>
</helmet>
<div style="position: relative; width: 420px; height: 900px; overflow: hidden; background: linear-gradient(180deg, #111c2e 0%, #0b1220 55%, #070a12 100%); color: #ffffff;">

  <div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: 60px; gap: 0; padding: 4px;">
    <sc-for list="{{cells}}" as="cell" hint-placeholder-count="105">
      <div style="margin: 5px; border: 1px solid rgba(255,255,255,0.05); border-radius: 5px;"></div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 50%; top: 470px; width: 12px; height: 150px; transform: translateX(-50%); background: #33456a;"></div>
  <div style="position: absolute; left: 50%; top: 470px; width: 4px; height: 150px; transform: translateX(-50%); background: #7d93bd;"></div>
  <div style="position: absolute; left: 50%; top: 612px; width: 34px; height: 34px; transform: translate(-50%, -50%); background: #ffffff; border-radius: 4px; box-shadow: 0 0 26px rgba(76,224,179,0.45);"></div>
  <div style="position: absolute; left: 50%; top: 612px; width: 13px; height: 13px; transform: translate(-50%, -50%); background: #0d1524; border-radius: 2px;"></div>

  <div style="position: absolute; left: 0; right: 0; top: 96px; text-align: center;">
    <div style="font-size: 41px; font-weight: 600; letter-spacing: 0.02em;">PIPE RUNNER</div>
    <div style="margin-top: 8px; font-size: 18px; color: rgba(255,255,255,0.6);">The cart never stops. Lay the track.</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 172px; display: flex; justify-content: center; gap: 14px;">
    <div style="padding: 18px 24px; border: 2px solid rgba(255,210,63,0.45); border-radius: 28px; background: rgba(11,18,32,0.85); color: #ffd23f; font-size: 16px; font-weight: 600;">DAILY · BEST 4</div>
    <div style="padding: 18px 24px; border: 2px solid rgba(76,224,179,0.45); border-radius: 28px; background: rgba(11,18,32,0.85); color: #4ce0b3; font-size: 16px; font-weight: 600;">GOALS 1/3</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 58px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; box-sizing: border-box;">
    <div style="padding: 20px 26px; border: 2px solid rgba(76,224,179,0.45); border-radius: 28px; background: rgba(11,18,32,0.85); color: #4ce0b3; font-size: 20px; font-weight: 600;">UPGRADES</div>
    <div style="padding: 26px 46px; border-radius: 44px; background: #4ce0b3; color: #061f18; font-size: 33px; font-weight: 700;">START</div>
    <div style="padding: 20px 26px; border: 2px solid rgba(76,224,179,0.45); border-radius: 28px; background: rgba(11,18,32,0.85); color: #4ce0b3; font-size: 20px; font-weight: 600;">SETTINGS</div>
  </div>

  <div style="position: absolute; left: 14px; top: 14px; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.65); font-size: 13px; letter-spacing: 0.08em;">SHIPPING BUILD</div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const cells = [];
    for (let i = 0; i < 105; i += 1) cells.push({ i });
    return { cells };
  }
}
</script>
</body>
</html>
