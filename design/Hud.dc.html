<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "Noto Sans", system-ui, sans-serif; }
    a { color: #4ce0b3; } a:hover { color: #7febc9; }
  </style>
</helmet>
<div style="position: relative; width: 420px; height: 900px; overflow: hidden; background: linear-gradient(180deg, #111c2e 0%, #0b1220 55%, #070a12 100%); color: #ffffff;">

  <div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: 60px; padding: 4px;">
    <sc-for list="{{cells}}" as="cell" hint-placeholder-count="105">
      <div style="margin: 5px; border: 1px solid rgba(255,255,255,0.05); border-radius: 5px;"></div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 180px; top: 300px; width: 12px; height: 120px; background: #33456a;"></div>
  <div style="position: absolute; left: 184px; top: 300px; width: 4px; height: 120px; background: #7d93bd;"></div>
  <div style="position: absolute; left: 180px; top: 414px; width: 130px; height: 12px; background: #33456a;"></div>
  <div style="position: absolute; left: 180px; top: 418px; width: 130px; height: 4px; background: #7d93bd;"></div>
  <div style="position: absolute; left: 184px; top: 420px; width: 4px; height: 200px; background: #4ce0b3;"></div>
  <div style="position: absolute; left: 180px; top: 420px; width: 12px; height: 200px; background: rgba(43,56,84,0.9);"></div>
  <div style="position: absolute; left: 184px; top: 420px; width: 4px; height: 200px; background: #4ce0b3;"></div>
  <div style="position: absolute; left: 186px; top: 560px; width: 34px; height: 34px; transform: translate(-50%, -50%); background: #ffffff; border-radius: 4px; box-shadow: 0 0 26px rgba(76,224,179,0.45);"></div>

  <div style="position: absolute; left: 250px; top: 200px; width: 42px; height: 42px; transform: rotate(45deg); background: #4ce0b3; border-radius: 6px; box-shadow: 0 0 24px rgba(76,224,179,0.5);"></div>
  <div style="position: absolute; left: 262px; top: 212px; width: 18px; height: 18px; transform: rotate(45deg); background: #d5fff3; border-radius: 3px;"></div>

  <div style="position: absolute; left: 132px; top: 264px; width: 58px; height: 58px; border: 3px solid rgba(255,255,255,0.75); border-radius: 9px;"></div>

  <div style="position: absolute; left: 0; right: 0; top: 0; padding: 20px 20px 0; box-sizing: border-box;">
    <div style="display: flex; align-items: flex-end; justify-content: space-between;">
      <div style="display: flex; align-items: baseline; gap: 9px;">
        <div style="font-size: 44px; font-weight: 700; line-height: 1;">31</div>
        <div style="font-size: 15px; letter-spacing: 0.14em; color: rgba(255,255,255,0.5);">CELLS</div>
      </div>
      <div style="text-align: right;">
        <div style="font-size: 21px; font-weight: 600; color: rgba(255,255,255,0.85);">418</div>
        <div style="font-size: 13px; letter-spacing: 0.12em; color: rgba(255,255,255,0.38);">SCORE</div>
      </div>
    </div>

    <div style="margin-top: 14px; height: 12px; border-radius: 6px; background: rgba(255,255,255,0.1); overflow: hidden;">
      <div style="width: 34%; height: 100%; border-radius: 6px; background: #ffd23f;"></div>
    </div>
    <div style="margin-top: 6px; display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 12px; letter-spacing: 0.16em; color: rgba(255,255,255,0.4);">FUEL</div>
      <div style="font-size: 13px; font-weight: 600; color: #ffd23f;">CHAIN ×3</div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 656px; display: flex; align-items: center; gap: 10px; padding: 0 24px; box-sizing: border-box;">
    <div style="height: 1px; flex-grow: 1; background: repeating-linear-gradient(90deg, rgba(217,201,163,0.7) 0 10px, transparent 10px 18px);"></div>
    <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; color: rgba(217,201,163,0.9);">BEST 47</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 168px; background: linear-gradient(180deg, rgba(7,10,18,0) 0%, rgba(7,10,18,0.9) 42%);"></div>

  <div style="position: absolute; left: 16px; bottom: 34px; display: flex; flex-direction: column; align-items: center; gap: 7px;">
    <div style="font-size: 11px; letter-spacing: 0.16em; color: rgba(255,210,63,0.7);">HOLD</div>
    <div style="width: 74px; height: 74px; border-radius: 16px; border: 2px dashed rgba(255,210,63,0.45);"></div>
  </div>

  <div style="position: absolute; left: 122px; bottom: 34px; display: flex; flex-direction: column; align-items: center; gap: 7px;">
    <div style="font-size: 11px; letter-spacing: 0.16em; color: rgba(255,255,255,0.4);">NEXT</div>
    <div style="width: 88px; height: 88px; border-radius: 18px; border: 3px solid #4ce0b3; background: rgba(76,224,179,0.14); display: flex; align-items: center; justify-content: center;">
      <div style="width: 10px; height: 56px; border-radius: 5px; background: #4ce0b3;"></div>
    </div>
  </div>

  <div style="position: absolute; right: 16px; bottom: 46px; display: flex; align-items: center; gap: 9px;">
    <div style="width: 48px; height: 48px; border-radius: 12px; border: 2px solid rgba(255,210,63,0.5); background: rgba(255,210,63,0.1); display: flex; align-items: center; justify-content: center;">
      <div style="width: 26px; height: 7px; border-radius: 4px; background: #ffd23f;"></div>
    </div>
    <div style="width: 42px; height: 42px; border-radius: 11px; border: 2px solid rgba(176,124,255,0.45); background: rgba(176,124,255,0.08); display: flex; align-items: center; justify-content: center;">
      <div style="width: 6px; height: 22px; border-radius: 3px; background: rgba(176,124,255,0.9);"></div>
    </div>
    <div style="width: 36px; height: 36px; border-radius: 10px; border: 2px solid rgba(86,184,232,0.4); background: rgba(86,184,232,0.07);"></div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const cells = [];
    for (let i = 0; i < 105; i += 1) cells.push({ i });
    return { cells };
  }
}
</script>
</body>
</html>
