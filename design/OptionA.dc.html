<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "Noto Sans", system-ui, sans-serif; }
    a { color: #4ce0b3; } a:hover { color: #7febc9; }
  </style>
</helmet>
<div style="position: relative; width: 420px; height: 900px; overflow: hidden; background: linear-gradient(180deg, #111c2e 0%, #0b1220 55%, #070a12 100%); color: #ffffff;">

  <div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: 60px; padding: 4px;">
    <sc-for list="{{cells}}" as="cell" hint-placeholder-count="105">
      <div style="margin: 5px; border: 1px solid rgba(255,255,255,0.04); border-radius: 5px;"></div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 50%; top: 430px; width: 12px; height: 190px; transform: translateX(-50%); background: #33456a;"></div>
  <div style="position: absolute; left: 50%; top: 430px; width: 4px; height: 190px; transform: translateX(-50%); background: #7d93bd;"></div>
  <div style="position: absolute; left: 50%; top: 612px; width: 34px; height: 34px; transform: translate(-50%, -50%); background: #ffffff; border-radius: 4px; box-shadow: 0 0 26px rgba(76,224,179,0.45);"></div>

  <div style="position: absolute; left: 0; right: 0; top: 104px; text-align: center;">
    <div style="font-size: 41px; font-weight: 600;">PIPE RUNNER</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 180px; display: flex; flex-direction: column; align-items: center; gap: 4px;">
    <div style="font-size: 13px; letter-spacing: 0.22em; color: rgba(255,255,255,0.45);">FURTHEST</div>
    <div style="display: flex; align-items: baseline; gap: 8px;">
      <div style="font-size: 68px; font-weight: 700; line-height: 1; color: #4ce0b3;">47</div>
      <div style="font-size: 20px; color: rgba(255,255,255,0.5);">cells</div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 148px; display: flex; justify-content: center;">
    <div style="padding: 30px 74px; border-radius: 56px; background: #4ce0b3; color: #061f18; font-size: 38px; font-weight: 700; box-shadow: 0 10px 40px rgba(76,224,179,0.25);">PLAY</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 62px; display: flex; align-items: center; justify-content: center; gap: 16px;">
    <div style="padding: 16px 22px; border-radius: 26px; border: 2px solid rgba(255,210,63,0.4); color: #ffd23f; font-size: 15px; font-weight: 600;">TODAY'S MAP</div>
    <div style="width: 52px; height: 52px; border-radius: 26px; border: 2px solid rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.6">
        <circle cx="12" cy="12" r="3.2"></circle>
        <path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2L5.6 5.6"></path>
      </svg>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const cells = [];
    for (let i = 0; i < 105; i += 1) cells.push({ i });
    return { cells };
  }
}
</script>
</body>
</html>
