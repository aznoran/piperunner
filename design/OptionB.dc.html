<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "Noto Sans", system-ui, sans-serif; }
    a { color: #4ce0b3; } a:hover { color: #7febc9; }
  </style>
</helmet>
<div style="position: relative; width: 420px; height: 900px; overflow: hidden; background: linear-gradient(180deg, #111c2e 0%, #0b1220 55%, #070a12 100%); color: #ffffff;">

  <div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: 60px; padding: 4px;">
    <sc-for list="{{cells}}" as="cell" hint-placeholder-count="105">
      <div style="margin: 5px; border: 1px solid rgba(255,255,255,0.04); border-radius: 5px;"></div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 50%; top: 452px; width: 12px; height: 168px; transform: translateX(-50%); background: #33456a;"></div>
  <div style="position: absolute; left: 50%; top: 452px; width: 4px; height: 168px; transform: translateX(-50%); background: #7d93bd;"></div>
  <div style="position: absolute; left: 50%; top: 612px; width: 34px; height: 34px; transform: translate(-50%, -50%); background: #ffffff; border-radius: 4px; box-shadow: 0 0 26px rgba(76,224,179,0.45);"></div>

  <div style="position: absolute; left: 0; right: 0; top: 92px; text-align: center;">
    <div style="font-size: 41px; font-weight: 600;">PIPE RUNNER</div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 158px; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; box-sizing: border-box; border-radius: 18px; background: rgba(21,32,58,0.75); border: 1px solid rgba(76,224,179,0.18);">
    <div style="display: flex; align-items: center; gap: 9px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#4ce0b3"><path d="M12 2l6 6-6 14-6-14z"></path></svg>
      <span style="font-size: 19px; font-weight: 600; color: #4ce0b3;">214</span>
    </div>
    <div style="display: flex; align-items: baseline; gap: 7px;">
      <span style="font-size: 13px; letter-spacing: 0.14em; color: rgba(255,255,255,0.4);">FURTHEST</span>
      <span style="font-size: 19px; font-weight: 600;">47</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 214px; display: flex; justify-content: center;">
    <div style="padding: 28px 68px; border-radius: 52px; background: #4ce0b3; color: #061f18; font-size: 36px; font-weight: 700; box-shadow: 0 10px 40px rgba(76,224,179,0.22);">PLAY</div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 128px; display: flex; justify-content: center;">
    <div style="display: flex; align-items: center; gap: 10px; padding: 14px 22px; border-radius: 24px; border: 2px solid rgba(255,210,63,0.4); background: rgba(11,18,32,0.8);">
      <span style="font-size: 15px; font-weight: 600; color: #ffd23f;">TODAY'S MAP</span>
      <span style="width: 1px; height: 16px; background: rgba(255,255,255,0.18);"></span>
      <span style="font-size: 15px; color: rgba(255,255,255,0.55);">best 4</span>
    </div>
  </div>

  <div style="position: absolute; left: 14px; right: 14px; bottom: 52px; display: flex; align-items: stretch; gap: 12px;">
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 20px 0; border-radius: 28px; border: 2px solid rgba(76,224,179,0.45); background: rgba(11,18,32,0.85);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4ce0b3" stroke-width="1.7" stroke-linecap="round">
        <path d="M3 7h7M14 7h7M3 12h4M11 12h10M3 17h12M19 17h2"></path>
        <circle cx="12" cy="7" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="17" r="2"></circle>
      </svg>
      <span style="font-size: 20px; font-weight: 600; color: #4ce0b3;">DEPOT</span>
      <span style="min-width: 22px; height: 22px; border-radius: 11px; background: #ffd23f; color: #2a1f00; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 6px; box-sizing: border-box;">3</span>
    </div>
    <div style="width: 64px; display: flex; align-items: center; justify-content: center; border-radius: 28px; border: 2px solid rgba(255,255,255,0.16); background: rgba(11,18,32,0.85);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.6">
        <circle cx="12" cy="12" r="3.2"></circle>
        <path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2L5.6 5.6"></path>
      </svg>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const cells = [];
    for (let i = 0; i < 105; i += 1) cells.push({ i });
    return { cells };
  }
}
</script>
</body>
</html>
